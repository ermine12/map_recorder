<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f0f14">
  <meta name="description" content="Record GPS walking paths and export clean GeoJSON files for custom map layers.">
  <title>Shortcut Path Recorder</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin="" />

  <!-- App CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- GPS Permission overlay (shown before map loads if needed) -->
  <div id="gps-permission-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div class="overlay-icon">📍</div>
      <h2>Location Access Required</h2>
      <p>This app needs your GPS location to record walking paths. Your data stays on your device — nothing is sent to any server.</p>
      <button id="btn-grant-gps" class="btn btn-start">Enable GPS Location</button>
      <button id="btn-skip-gps" class="btn-text">Continue without GPS</button>
    </div>
  </div>

  <!-- Map container -->
  <div id="map"></div>

  <!-- GPS accuracy badge (top-right) -->
  <div id="gps-accuracy">
    <span id="gps-accuracy-icon">📡</span>
    <span id="gps-accuracy-text">Acquiring…</span>
  </div>

  <!-- Auto-follow toggle (top-left, below zoom) -->
  <button id="btn-follow" class="map-btn" title="Auto-follow GPS position">
    <span id="follow-icon">🎯</span>
  </button>

  <!-- Toast notification container -->
  <div id="toast-container"></div>

  <!-- Control panel overlay -->
  <div id="controls">
    <h1 class="app-title">Shortcut Path Recorder</h1>

    <!-- Status bar -->
    <div id="status-bar">
      <div class="status-item">
        <span class="status-label">Status</span>
        <span id="rec-state" class="status-value idle">Idle</span>
      </div>
      <div class="status-item">
        <span class="status-label">Time</span>
        <span id="rec-time" class="status-value">00:00</span>
      </div>
      <div class="status-item">
        <span class="status-label">Distance</span>
        <span id="rec-distance" class="status-value">0 m</span>
      </div>
      <div class="status-item">
        <span class="status-label">Points</span>
        <span id="rec-points" class="status-value">0</span>
      </div>
    </div>

    <!-- Action buttons -->
    <div id="action-buttons">
      <button id="btn-start" class="btn btn-start">⏺ Start Recording</button>
      <button id="btn-stop" class="btn btn-stop" disabled>⏹ Stop &amp; Clean</button>
      <button id="btn-download" class="btn btn-download" disabled>⬇ Download GeoJSON</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <!-- App JS -->
  <script src="app.js"></script>
</body>
</html>
